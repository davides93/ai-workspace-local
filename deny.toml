# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).
# CI runs `cargo deny check advisories bans licenses sources` (.github/workflows/audit.yml).
# No advisory is ignored here: the ones without a fix are listed in SECURITY.md and docs/STATUS.md instead.

[graph]
# The desktop shell (Tauri) is part of the workspace; its Linux and other targets are checked too.
all-features = false

[advisories]
version = 2
# Unmaintained crates that come in only through the Tauri/GTK stack are reported as warnings, not errors.
unmaintained = "workspace"
yanked = "deny"

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "OpenSSL",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# The workspace crates are not published (`publish = false`) and the repository has no licence file yet.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
