name: Release (DMG macOS, installer Windows; arm64 e CUDA opzionali)

# Fuori store: il DMG macOS (senza sandbox, con tutte le funzioni) e l'installer Windows (.exe).
# iOS, Android e la versione Mac App Store (sandbox, `--features mas`) escono dal flusso degli store:
# vedi .github/workflows/store.yml e docs/store/README.md.
# Heavy, multi-platform builds run on demand or for version tags only.
#
# Che cosa si costruisce lo decide scripts/ci/select-targets.sh (provabile in locale con --self-test):
#   - `default` (nessun input e nessuna variabile): solo Windows x64 e macOS universale, come sempre;
#   - input `targets` di "Run workflow", oppure la variabile del repository AIW_RELEASE_TARGETS per i
#     tag: un elenco separato da virgole di target (windows-x64, macos, linux-arm64, windows-arm64,
#     daemon-linux-arm64, daemon-windows-arm64, cuda-linux, cuda-windows) o di gruppi (default, arm64,
#     cuda, extras, all). I target nuovi (arm64, CUDA) non fermano mai la release se falliscono.
# Procedura completa: docs/release/RELEASE.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da pubblicare (es. v0.5.0-beta.2); vuoto = solo build, nessuna release"
        required: false
        default: ""
      targets:
        description: "Target da costruire, separati da virgole (es. linux-arm64,cuda); vuoto = default (+ variabile AIW_RELEASE_TARGETS). Gruppi: default, arm64, cuda, extras, all"
        required: false
        default: ""
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

# Read-only by default; only the publish job gets write access to create the release.
permissions:
  contents: read

jobs:
  # Which targets to build: see scripts/ci/select-targets.sh. The matrices of the jobs below come from here.
  select:
    name: Target da costruire
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.sel.outputs.desktop }}
      daemon: ${{ steps.sel.outputs.daemon }}
      cuda: ${{ steps.sel.outputs.cuda }}
      core: ${{ steps.sel.outputs.core }}
      selected: ${{ steps.sel.outputs.selected }}
    steps:
      - uses: actions/checkout@v4
      - id: sel
        env:
          INPUT_TARGETS: ${{ inputs.targets }}
          VAR_TARGETS: ${{ vars.AIW_RELEASE_TARGETS }}
        run: bash scripts/ci/select-targets.sh

  desktop:
    name: Desktop ${{ matrix.name }}
    needs: select
    if: needs.select.outputs.desktop != '[]'
    # The arm64 legs are new and never ran on a tag: they never block the release (`optional`).
    continue-on-error: ${{ matrix.optional }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.desktop) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Windows arm64: rustup and an arm64-native libclang (bindgen) before the toolchain action.
      - name: Rust e libclang (Windows arm64)
        if: matrix.arm && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/setup-windows-arm64.ps1 -Step rust
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      # xcap (computer-use) needs newer PipeWire headers than Ubuntu 22.04 ships: Linux builds without it.
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config libclang-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      # llama.cpp's CMake build on Windows arm64: arm64 MSVC environment and Ninja (as the Vulkan
      # job of the old daemon builds needed it: the Visual Studio generator failed in nested projects).
      - name: MSVC arm64 (Windows arm64)
        if: matrix.arm && runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: CMake e Ninja (Windows arm64)
        if: matrix.arm && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/setup-windows-arm64.ps1 -Step tools
      # Apple Foundation Models (macOS 26+): the Swift helper of the native plugin needs the macOS 26
      # SDK, i.e. Xcode 26. It is used for the helper only (build.rs): compiling llama.cpp with
      # Xcode 26 leaves `___isPlatformVersionAtLeast` undefined at link time, so the rest of the
      # build keeps the runner's default Xcode. The app keeps its macOS 11 deployment target.
      - name: Xcode 26 for the Swift helper (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dev="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$dev" ]; then
            echo "::error::Xcode 26 non è installato su questo runner"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          echo "Xcode 26: $dev"
          echo "AIW_APPLE_FM_DEVELOPER_DIR=$dev/Contents/Developer" >> "$GITHUB_ENV"
      # llama.cpp's Metal sources use `@available`, which the clang of Xcode 16+ compiles to calls to
      # `___isPlatformVersionAtLeast`. That function lives in the clang runtime library, which Rust
      # does not link (`-nodefaultlibs`): without it `aiw-desktop` fails at link time. Linking the
      # runtime of the selected toolchain explicitly is the usual fix (the archive is universal).
      - name: Link the clang runtime (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rt="$(clang --print-resource-dir)/lib/darwin/libclang_rt.osx.a"
          if [ ! -f "$rt" ]; then
            echo "::error::libclang_rt.osx.a non trovata in $rt"
            exit 1
          fi
          echo "clang runtime: $rt"
          echo "RUSTFLAGS=-C link-arg=$rt" >> "$GITHUB_ENV"
      - run: npm ci --prefix apps/ui
      - run: npm ci --prefix apps/desktop
      # ---- Firma del codice (docs/release/FIRMA.md) -------------------------------------------
      # Senza i segreti questi passi non fanno nulla e la build resta identica a prima (DMG e
      # installer non firmati). Con i segreti: macOS firma con Developer ID e notarizza; Windows
      # firma con un PFX oppure con Azure Trusted Signing (si sceglie in base ai segreti presenti).
      # I segreti non si passano mai a Tauri vuoti: una variabile vuota sarebbe letta come "presente".
      - name: Firma macOS (Developer ID e notarizzazione, solo con i segreti)
        if: runner.os == 'macOS'
        shell: bash
        env:
          S_CERT: ${{ secrets.APPLE_CERTIFICATE }}
          S_CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          S_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          S_APPLE_ID: ${{ secrets.APPLE_ID }}
          S_APPLE_PW: ${{ secrets.APPLE_PASSWORD }}
          S_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$S_CERT" ] || [ -z "$S_CERT_PW" ] || [ -z "$S_IDENTITY" ]; then
            echo "::notice::Firma macOS non configurata: il DMG esce non firmato, come prima (vedi docs/release/FIRMA.md)."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=$(printf '%s' "$S_CERT" | tr -d '[:space:]')"
            echo "APPLE_CERTIFICATE_PASSWORD=$S_CERT_PW"
            echo "APPLE_SIGNING_IDENTITY=$S_IDENTITY"
            # Entitlements per l'hardened runtime (richiesto dalla notarizzazione): src-tauri/tauri.devid.conf.json
            echo "AIW_SIGN_ARGS=--config src-tauri/tauri.devid.conf.json"
            echo "AIW_SIGN_MAC=1"
          } >> "$GITHUB_ENV"
          if [ -n "$S_APPLE_ID" ] && [ -n "$S_APPLE_PW" ] && [ -n "$S_TEAM" ]; then
            {
              echo "APPLE_ID=$S_APPLE_ID"
              echo "APPLE_PASSWORD=$S_APPLE_PW"
              echo "APPLE_TEAM_ID=$S_TEAM"
              echo "AIW_NOTARIZE_MAC=1"
            } >> "$GITHUB_ENV"
            echo "::notice::Firma macOS Developer ID con notarizzazione."
          else
            echo "::warning::Firma macOS senza notarizzazione: mancano APPLE_ID, APPLE_PASSWORD o APPLE_TEAM_ID. Gatekeeper avviserà comunque."
          fi

      - name: Firma Windows - scelta del metodo
        if: runner.os == 'Windows'
        id: winsign
        shell: pwsh
        env:
          S_PFX: ${{ secrets.WINDOWS_CERTIFICATE }}
          S_PFX_PW: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          S_AZ_CLIENT: ${{ secrets.AZURE_CLIENT_ID }}
          S_AZ_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          S_AZ_TENANT: ${{ secrets.AZURE_TENANT_ID }}
          S_AZ_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          S_AZ_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          S_AZ_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          $azure = $env:S_AZ_CLIENT -and $env:S_AZ_SECRET -and $env:S_AZ_TENANT -and $env:S_AZ_ENDPOINT -and $env:S_AZ_ACCOUNT -and $env:S_AZ_PROFILE
          $pfx = $env:S_PFX -and $env:S_PFX_PW
          if ($azure) { $mode = 'azure' } elseif ($pfx) { $mode = 'pfx' } else { $mode = 'none' }
          if ($mode -eq 'none' -and ($env:S_AZ_CLIENT -or $env:S_AZ_SECRET -or $env:S_AZ_TENANT -or $env:S_AZ_ENDPOINT -or $env:S_AZ_ACCOUNT -or $env:S_AZ_PROFILE -or $env:S_PFX -or $env:S_PFX_PW)) {
            Write-Output "::warning::Segreti di firma Windows incompleti: l'installer esce non firmato (vedi docs/release/FIRMA.md)."
          } elseif ($mode -eq 'none') {
            Write-Output "::notice::Firma Windows non configurata: l'installer esce non firmato, come prima (vedi docs/release/FIRMA.md)."
          } else {
            Write-Output "::notice::Firma Windows: $mode."
          }
          "mode=$mode" >> $env:GITHUB_OUTPUT

      - name: Firma Windows - certificato PFX
        if: runner.os == 'Windows' && steps.winsign.outputs.mode == 'pfx'
        shell: pwsh
        env:
          S_PFX: ${{ secrets.WINDOWS_CERTIFICATE }}
          S_PFX_PW: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String(($env:S_PFX -replace '\s', '')))
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:S_PFX_PW -Force -AsPlainText)
          Remove-Item $pfxPath
          $ts = if ($env:TIMESTAMP_URL) { $env:TIMESTAMP_URL } else { 'http://timestamp.digicert.com' }
          $conf = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = $ts } } }
          $conf | ConvertTo-Json -Depth 5 | Set-Content -Path apps/desktop/src-tauri/signing.windows.conf.json
          "AIW_SIGN_ARGS=--config src-tauri/signing.windows.conf.json" >> $env:GITHUB_ENV
          "AIW_SIGN_WIN=1" >> $env:GITHUB_ENV

      - name: Firma Windows - Azure Trusted Signing
        if: runner.os == 'Windows' && steps.winsign.outputs.mode == 'azure'
        shell: pwsh
        env:
          S_AZ_CLIENT: ${{ secrets.AZURE_CLIENT_ID }}
          S_AZ_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          S_AZ_TENANT: ${{ secrets.AZURE_TENANT_ID }}
          S_AZ_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          S_AZ_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          S_AZ_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          cargo install artifact-signing-cli --locked
          $cmd = "artifact-signing-cli -e $($env:S_AZ_ENDPOINT) -a $($env:S_AZ_ACCOUNT) -c $($env:S_AZ_PROFILE) -d `"AI Workspace Local`" %1"
          $conf = @{ bundle = @{ windows = @{ signCommand = $cmd } } }
          $conf | ConvertTo-Json -Depth 5 | Set-Content -Path apps/desktop/src-tauri/signing.windows.conf.json
          "AZURE_CLIENT_ID=$($env:S_AZ_CLIENT)" >> $env:GITHUB_ENV
          "AZURE_CLIENT_SECRET=$($env:S_AZ_SECRET)" >> $env:GITHUB_ENV
          "AZURE_TENANT_ID=$($env:S_AZ_TENANT)" >> $env:GITHUB_ENV
          "AIW_SIGN_ARGS=--config src-tauri/signing.windows.conf.json" >> $env:GITHUB_ENV
          "AIW_SIGN_WIN=1" >> $env:GITHUB_ENV

      - name: Build bundles
        working-directory: apps/desktop
        # On macOS the build fails instead of silently leaving the Apple Foundation Models helper
        # out (tauri-plugin-aiw-native/build.rs).
        env:
          AIW_REQUIRE_APPLE_FM: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: npx tauri build ${{ matrix.args }} ${{ env.AIW_SIGN_ARGS }}
      # Se la firma era configurata, una build non firmata o non notarizzata deve far fallire il lavoro:
      # meglio nessuna release di un DMG o un installer che il sistema blocca.
      - name: Verifica firma macOS
        if: runner.os == 'macOS' && env.AIW_SIGN_MAC == '1'
        shell: bash
        run: |
          set -euo pipefail
          app="$(find target -path '*release/bundle/macos/*.app' -maxdepth 8 -type d | head -n 1)"
          test -n "$app" || { echo "::error::app non trovata per la verifica"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E "Authority|TeamIdentifier|flags"
          if [ "${AIW_NOTARIZE_MAC:-}" = "1" ]; then
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
          fi
      - name: Verifica firma Windows
        if: runner.os == 'Windows' && env.AIW_SIGN_WIN == '1'
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path target -Recurse -Filter '*-setup.exe'
          if (-not $files) { throw 'installer non trovato per la verifica' }
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Output "$($f.Name): $($sig.Status) - $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "firma non valida: $($f.Name)" }
          }
      # RPM versions cannot contain '-' ("0.5.0-beta.8" is rejected by the bundler): the prerelease is
      # spelled the RPM way (0.5.0~beta.8, sorts before 0.5.0) through a config override used by this
      # build only; the app and the other bundles keep the real version. If the Tauri CLI refuses a
      # non-semver override the release still ships the .deb and the AppImage.
      - name: Build RPM (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        working-directory: apps/desktop
        run: |
          rpm_version=$(node -p "require('./src-tauri/tauri.conf.json').version.replace('-', '~')")
          npx tauri build --bundles rpm --config "{\"version\":\"$rpm_version\"}"
      - uses: actions/upload-artifact@v4
        with:
          name: aiw-desktop-${{ matrix.os }}
          path: |
            target/**/release/bundle/**/*-setup.exe
            target/**/release/bundle/**/*.dmg
            target/**/release/bundle/**/*.deb
            target/**/release/bundle/**/*.rpm
            target/**/release/bundle/**/*.AppImage
          if-no-files-found: error

  core-tests:
    name: Core tests ${{ matrix.os }}
    needs: select
    # Part of the default release: skipped when a manual run selects only other targets.
    if: needs.select.outputs.core == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --no-fail-fast

  # Daemon/CLI `aiw` for arm64 (embedded llama.cpp, CPU only: no GPU backend is built for arm64).
  # Optional: native arm runners, never run on a tag before; a failure here never blocks the release.
  daemon-arm64:
    name: aiw daemon ${{ matrix.name }}
    needs: select
    if: needs.select.outputs.daemon != '[]'
    continue-on-error: true
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.daemon) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust e libclang (Windows arm64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/setup-windows-arm64.ps1 -Step rust
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: daemon-arm64
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config libclang-dev
      - name: MSVC arm64 (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: CMake e Ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/setup-windows-arm64.ps1 -Step tools
      # Windows: a short target dir (llama.cpp's nested CMake projects exceed MAX_PATH under
      # D:\a\<repo>\<repo>\target\...) and pwsh, not bash (Git's bash puts its own usr/bin/link.exe
      # in front of MSVC's linker).
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CARGO_TARGET_DIR: C:\t
          CMAKE_GENERATOR: Ninja
        run: cargo build --release -p aiw-cli --features llama-embedded
      - name: Build
        if: runner.os != 'Windows'
        run: cargo build --release -p aiw-cli --features llama-embedded
      # Distinct file names per platform, so the artifacts can be merged without collisions.
      - name: Name the binary
        shell: bash
        run: |
          mkdir -p dist
          src=target/release/aiw
          if [ "$RUNNER_OS" = "Windows" ]; then src=/c/t/release/aiw.exe; fi
          cp "$src" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: aiw-daemon-${{ matrix.os }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  # CUDA 12 builds of the daemon (embedded llama.cpp with `llama-cuda`), Windows x64 and Linux x64.
  # Like the Vulkan job of the old daemon builds: optional and non-blocking (`continue-on-error`), a
  # CUDA toolchain hiccup never fails the release. The toolkit is installed with only nvcc, the
  # runtime and cuBLAS (network installer), and NO NVIDIA file is shipped:
  #   - Linux links cudart and cuBLAS statically (llama-cpp-sys-2): the binary needs only the NVIDIA
  #     driver (libcuda.so.1);
  #   - Windows links them dynamically: it needs the driver and the CUDA 12 runtime DLLs
  #     (cudart64_12.dll, cublas64_12.dll, cublasLt64_12.dll) that the person installs with the
  #     CUDA Toolkit 12.x. See docs/release/RELEASE.md.
  cuda:
    name: aiw daemon (CUDA 12) ${{ matrix.name }}
    needs: select
    if: needs.select.outputs.cuda != '[]'
    continue-on-error: true
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.cuda) }}
    runs-on: ${{ matrix.os }}
    env:
      CUDA_VERSION: "12.8.1"
      # Real code for Turing, Ampere and Ada, PTX for Pascal and Hopper/Blackwell (JIT at first use).
      # Forwarded to CMake by llama-cpp-sys-2 (every CMAKE_* variable of the environment is).
      CMAKE_CUDA_ARCHITECTURES: "61-virtual;75-real;80-real;86-real;89-real;90-virtual"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: cuda12
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config libclang-dev
      # Same sub-packages as llama.cpp's own CI uses on Windows. On Linux the names get the cuda-
      # prefix and the version suffix from the action; `driver-dev` brings the libcuda.so stub the
      # linker needs on a machine without a GPU.
      - name: CUDA toolkit (Linux)
        if: runner.os == 'Linux'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network
          sub-packages: '["nvcc", "cudart-dev", "cccl", "driver-dev"]'
          non-cuda-sub-packages: '["libcublas-dev"]'
          log-file-suffix: ${{ matrix.id }}.txt
      - name: CUDA toolkit (Windows)
        if: runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration"]'
          log-file-suffix: ${{ matrix.id }}.txt
      - name: MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CARGO_TARGET_DIR: C:\t
          CMAKE_GENERATOR: Ninja
        run: |
          nvcc --version
          cargo build --release -p aiw-cli --features llama-cuda
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          nvcc --version
          # `-lcuda` resolves to the stub of the toolkit; at run time the driver's libcuda.so.1 is used.
          export RUSTFLAGS="-L native=${CUDA_PATH}/lib64/stubs"
          cargo build --release -p aiw-cli --features llama-cuda
      # No NVIDIA library may be a runtime dependency on Linux (cudart and cuBLAS are linked in).
      - name: Check the dynamic dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            dumpbin //dependents C:/t/release/aiw.exe | grep -iE "cuda|cublas|nvcuda" || true
          else
            ldd target/release/aiw | tee /dev/stderr | grep -iE "libcuda|libcudart|libcublas" || true
            if ldd target/release/aiw | grep -iE "libcudart|libcublas"; then
              echo "::error::il binario dipende da cudart/cuBLAS condivise: servirebbe distribuirle"
              exit 1
            fi
          fi
      - name: Name the binary
        shell: bash
        run: |
          mkdir -p dist
          src=target/release/aiw
          if [ "$RUNNER_OS" = "Windows" ]; then src=/c/t/release/aiw.exe; fi
          cp "$src" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: aiw-daemon-${{ matrix.os }}-cuda12
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  # Creates the GitHub (pre)release from the artifacts of the build jobs (the macOS DMG and the
  # Windows installer, plus the optional arm64 and CUDA files when they were built). Tags only.
  # The optional jobs are continue-on-error, so their files are included when present.
  publish:
    name: Publish release
    # A pushed tag, or a manual run with a tag name: the release action then creates the tag on
    # the commit that was built (useful where pushing tags is not possible).
    # `desktop` must not have failed (it is skipped when only other targets were selected); the
    # optional jobs cannot fail the release.
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.desktop.result != 'failure' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))) }}
    needs: [select, desktop, daemon-arm64, cuda]
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: aiw-*
          merge-multiple: true
      - name: Rename and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          tag="${RELEASE_TAG}"
          ver="${tag#v}"
          # Bundles keep the bundler names (spaces become underscores: GitHub rewrites them anyway).
          # The daemon binaries are named aiw-<version>-<os>-<arch>[-cuda12][.exe]: the `aiw-` prefix is
          # what the in-app updater uses to skip them when it looks for an installer.
          while IFS= read -r f; do
            b="$(basename "$f")"
            case "$b" in
              aiw-linux-*|aiw-windows-*|aiw-macos-*) cp "$f" "release/aiw-${ver}-${b#aiw-}" ;;
              *) cp "$f" "release/${b// /_}" ;;
            esac
          done < <(find artifacts -type f | sort)
          ls -l release
          test -n "$(ls -A release)"
          (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      # The repository has immutable releases: files can only be attached while the release is a
      # draft, and publishing locks it (and its tag) for good. So the release is created as a draft
      # with every file, and published only afterwards.
      - uses: softprops/action-gh-release@v2
        id: release
        with:
          draft: true
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: AI Workspace Local ${{ env.RELEASE_TAG }}
          body_path: docs/release-notes/${{ env.RELEASE_TAG }}.md
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          fail_on_unmatched_files: true
          files: release/*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false
