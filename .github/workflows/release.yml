name: Build apps (Windows, macOS, Linux, Android, iOS)

# Heavy, multi-platform builds run on demand or for version tags only.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Desktop ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x64, os: ubuntu-22.04, args: "" }
          - { name: Windows x64, os: windows-latest, args: "" }
          - { name: macOS Apple Silicon, os: macos-14, args: "--target aarch64-apple-darwin" }
          - { name: macOS Intel, os: macos-13, args: "--target x86_64-apple-darwin" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev
      - run: npm ci --prefix apps/ui
      - run: npm ci --prefix apps/desktop
      - name: Build bundles
        working-directory: apps/desktop
        run: npx tauri build ${{ matrix.args }} -- --features computer-use
      - uses: actions/upload-artifact@v4
        with:
          name: aiw-desktop-${{ matrix.os }}
          path: |
            target/**/release/bundle/**/*.deb
            target/**/release/bundle/**/*.rpm
            target/**/release/bundle/**/*.AppImage
            target/**/release/bundle/**/*.msi
            target/**/release/bundle/**/*.exe
            target/**/release/bundle/**/*.dmg
          if-no-files-found: warn

  daemon:
    name: aiw daemon ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p aiw-cli
      - uses: actions/upload-artifact@v4
        with:
          name: aiw-${{ matrix.os }}
          path: |
            target/release/aiw
            target/release/aiw.exe

  android:
    name: Android (arm64 APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;27.0.12077973" "platforms;android-36" "build-tools;36.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix apps/ui && npm ci --prefix apps/desktop
      - name: Init and build
        working-directory: apps/desktop
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          npx tauri android init --ci
          npx tauri android build --apk --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: aiw-android
          path: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  ios:
    name: iOS (Rust + Swift compile, unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix apps/ui && npm ci --prefix apps/desktop
      - name: Rust library for iOS
        run: cargo build -p aiw-desktop --lib --target aarch64-apple-ios
      - name: Xcode project (simulator build, no signing)
        working-directory: apps/desktop
        run: |
          npx tauri ios init --ci
          npx tauri ios build --target aarch64-sim --ci || echo "::warning::iOS build richiede un team di firma per il dispositivo; la libreria Rust è stata compilata"
