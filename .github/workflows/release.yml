name: Build apps (Windows, macOS, Linux, Android, iOS)

# Heavy, multi-platform builds run on demand or for version tags only.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da pubblicare (es. v0.4.0-beta.1); vuoto = solo build, nessuna release"
        required: false
        default: ""
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

# Read-only by default; only the publish job gets write access to create the release.
permissions:
  contents: read

jobs:
  desktop:
    name: Desktop ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # xcap (computer-use) needs newer PipeWire headers than Ubuntu 22.04 ships: Linux builds without it.
          - { name: Linux x64, os: ubuntu-22.04, args: "--bundles deb,appimage", targets: "" }
          - { name: Windows x64, os: windows-latest, args: "--features computer-use", targets: "" }
          - { name: macOS universale, os: macos-15, args: "--features computer-use --target universal-apple-darwin", targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      # Apple Foundation Models (macOS 26+): the Swift helper of the native plugin needs the
      # macOS 26 SDK, i.e. Xcode 26. The app itself keeps its macOS 11 deployment target.
      - name: Xcode 26 (macOS)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "^26.0"
      - run: npm ci --prefix apps/ui
      - run: npm ci --prefix apps/desktop
      - name: Build bundles
        working-directory: apps/desktop
        # On macOS the build fails instead of silently leaving the Apple Foundation Models helper
        # out (tauri-plugin-aiw-native/build.rs).
        env:
          AIW_REQUIRE_APPLE_FM: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: npx tauri build ${{ matrix.args }}
      # RPM versions cannot contain '-' ("0.4.0-beta.1" is rejected by the bundler) and the Tauri
      # config has no RPM-specific version, only release/epoch. The prerelease is spelled the RPM
      # way (0.4.0~beta.1, sorts before 0.4.0) through a config override used by this build only;
      # the app and the other bundles keep the real version.
      - name: Build RPM (Linux)
        if: runner.os == 'Linux'
        # RPM forbids '-' in versions: the rpm gets "0.4.0~beta.1". If the Tauri CLI refuses a
        # non-semver override the release still ships the .deb and the AppImage.
        continue-on-error: true
        working-directory: apps/desktop
        run: |
          rpm_version=$(node -p "require('./src-tauri/tauri.conf.json').version.replace('-', '~')")
          npx tauri build --bundles rpm --config "{\"version\":\"$rpm_version\"}"
      - uses: actions/upload-artifact@v4
        with:
          name: aiw-desktop-${{ matrix.os }}
          path: |
            target/**/release/bundle/**/*.deb
            target/**/release/bundle/**/*.rpm
            target/**/release/bundle/**/*.AppImage
            target/**/release/bundle/**/*.msi
            target/**/release/bundle/**/*.exe
            target/**/release/bundle/**/*.dmg
          if-no-files-found: warn

  core-tests:
    name: Core tests ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --no-fail-fast

  daemon:
    name: aiw daemon ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The daemon ships with llama.cpp linked in-process (Metal on macOS, CPU elsewhere).
          # `llama-metal` (like `llama-cuda` and `llama-vulkan`) implies `llama-embedded`: the
          # in-process runtime is registered with any of them. GPU builds of Linux/Windows:
          # see the `daemon-gpu` job below.
          - { os: ubuntu-22.04, features: llama-embedded, asset: aiw-linux-x64 }
          - { os: windows-latest, features: llama-embedded, asset: aiw-windows-x64.exe }
          - { os: macos-14, features: llama-metal, asset: aiw-macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p aiw-cli --features ${{ matrix.features }}
      # Distinct file names per platform, so the artifacts can be merged without collisions.
      - name: Name the binary
        shell: bash
        run: |
          mkdir -p dist
          src=target/release/aiw
          if [ "$RUNNER_OS" = "Windows" ]; then src=target/release/aiw.exe; fi
          cp "$src" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: aiw-${{ matrix.os }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  # GPU builds of the daemon (embedded llama.cpp with Vulkan: NVIDIA, AMD and Intel GPUs from one
  # binary). Experimental and non-blocking: they need glslc and the Vulkan headers/loader on the
  # runner, which the stock images do not ship, so a failure here never fails the release.
  #
  # CUDA is deliberately not built in CI (multi-GB toolkit, and the binary needs cudart/cublas
  # next to it). To build it on a machine with an NVIDIA GPU, the CUDA toolkit (12 or newer, nvcc
  # in PATH) and CMake:
  #     cargo build --release -p aiw-cli --features llama-cuda
  #     # desktop app (apps/desktop):  npx tauri build --features cuda
  # On a GitHub runner install the toolkit first (Jimver/cuda-toolkit, sub-packages nvcc, cudart,
  # cublas and cublas_dev) and ship cudart64_*.dll, cublas64_*.dll and cublasLt64_*.dll with the exe.
  daemon-gpu:
    name: aiw daemon (Vulkan) ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, asset: aiw-linux-x64-vulkan }
          - { os: windows-latest, asset: aiw-windows-x64-vulkan.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: vulkan
      - name: Vulkan headers, loader and glslc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev glslc spirv-headers
      # No guessed SDK version: LunarG's "latest" endpoints are used (the installer is named
      # vulkan-sdk.exe there; older SDKs used VulkanSDK-<ver>-Installer.exe). Every download is
      # checked to be a real PE executable (MZ header, > 10 MB) before it is run, because LunarG
      # answers an unknown URL with an HTML error page that "is not a valid application".
      - name: Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'vulkan-sdk.exe'
          $version = ''
          try { $version = (Invoke-RestMethod -Uri 'https://vulkan.lunarg.com/sdk/latest/windows.txt' -TimeoutSec 60).ToString().Trim() } catch { Write-Host "latest version lookup failed: $_" }
          $urls = @('https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe')
          if ($version -match '^\d+\.\d+\.\d+(\.\d+)?$') {
            Write-Host "LunarG latest SDK: $version"
            $urls += "https://sdk.lunarg.com/sdk/download/$version/windows/vulkan_sdk.exe"
            $urls += "https://sdk.lunarg.com/sdk/download/$version/windows/VulkanSDK-$version-Installer.exe"
          }
          $ok = $false
          foreach ($url in $urls) {
            for ($try = 1; $try -le 3 -and -not $ok; $try++) {
              Write-Host "Downloading $url (attempt $try)"
              Remove-Item $installer -ErrorAction SilentlyContinue
              & curl.exe --fail --silent --show-error --location --retry 2 --connect-timeout 30 --max-time 900 -o $installer $url
              if ($LASTEXITCODE -ne 0 -or -not (Test-Path $installer)) { Start-Sleep -Seconds (5 * $try); continue }
              $bytes = [IO.File]::ReadAllBytes($installer)
              if ($bytes.Length -gt 10MB -and $bytes[0] -eq 0x4D -and $bytes[1] -eq 0x5A) { $ok = $true }
              else {
                Write-Host "Not a PE executable ($($bytes.Length) bytes); first bytes:"
                Write-Host ([Text.Encoding]::ASCII.GetString($bytes, 0, [Math]::Min(200, $bytes.Length)))
                Start-Sleep -Seconds (5 * $try)
              }
            }
            if ($ok) { break }
          }
          if (-not $ok) { throw 'Could not download a valid Vulkan SDK installer from LunarG' }
          $root = 'C:\VulkanSDK'
          $p = Start-Process -FilePath $installer -ArgumentList @('--root', $root, '--accept-licenses', '--default-answer', '--confirm-command', 'install') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Vulkan SDK installer exited with $($p.ExitCode)" }
          # With --root the SDK lands in the root itself (older installers used a version subfolder).
          $sdk = @(Get-Item $root) + @(Get-ChildItem $root -Directory | Sort-Object Name -Descending) | Where-Object { Test-Path (Join-Path $_.FullName 'Bin\glslc.exe') } | Select-Object -First 1
          if (-not $sdk) { throw "glslc.exe not found under $root after install" }
          Write-Host "Vulkan SDK at $($sdk.FullName)"
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=$($sdk.FullName)"
          Add-Content $env:GITHUB_PATH (Join-Path $sdk.FullName 'Bin')
      - run: cargo build --release -p aiw-cli --features llama-vulkan
      - name: Name the binary
        shell: bash
        run: |
          mkdir -p dist
          src=target/release/aiw
          if [ "$RUNNER_OS" = "Windows" ]; then src=target/release/aiw.exe; fi
          cp "$src" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: aiw-${{ matrix.os }}-vulkan
          path: dist/${{ matrix.asset }}
          if-no-files-found: warn

  android:
    name: Android (arm64 APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner image ships the Android SDK and recent NDKs ($ANDROID_HOME, $ANDROID_NDK_LATEST_HOME).
      - name: Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null || true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix apps/ui && npm ci --prefix apps/desktop
      - name: Init and build
        working-directory: apps/desktop
        run: |
          # One NDK for everything: Tauri's linker (NDK_HOME) and llama.cpp's CMake build (ANDROID_NDK*).
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_NDK="$ANDROID_NDK_LATEST_HOME" ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_API_LEVEL=26
          npx tauri android init --ci
          # LiteRT-LM and ML Kit GenAI ship Kotlin 2.4 metadata: align the generated project. buildSrc
          # (AGP 9 pulls Kotlin 2.2 there) is loaded in a parent classloader, so it needs the bump too.
          sed -i -E 's/(kotlin-gradle-plugin:)[0-9.]+/\12.4.0/' src-tauri/gen/android/build.gradle.kts
          sed -i -E 's|(implementation\("com.android.tools.build:gradle:[0-9.]+"\))|\1\n    implementation("org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.0")|' src-tauri/gen/android/buildSrc/build.gradle.kts
          grep -n "kotlin-gradle-plugin" src-tauri/gen/android/build.gradle.kts src-tauri/gen/android/buildSrc/build.gradle.kts
          npx tauri android build --apk --target aarch64 --ci
      - uses: actions/upload-artifact@v4
        with:
          name: aiw-android
          path: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  ios:
    name: iOS (Rust + Swift compile, unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix apps/ui && npm ci --prefix apps/desktop
      - name: Rust library for iOS
        run: cargo build -p aiw-desktop --lib --target aarch64-apple-ios
      - name: Xcode project (simulator build, no signing)
        working-directory: apps/desktop
        run: |
          npx tauri ios init --ci
          npx tauri ios build --target aarch64-sim --ci || echo "::warning::iOS build richiede un team di firma per il dispositivo; la libreria Rust è stata compilata"

  # Creates the GitHub (pre)release from the artifacts of the build jobs. Tags only.
  # iOS is not in `needs`: it only compiles for the simulator and produces nothing installable.
  # daemon-gpu is continue-on-error, so its (optional) artifacts are included when present.
  publish:
    name: Publish release
    # A pushed tag, or a manual run with a tag name: the release action then creates the tag on
    # the commit that was built (useful where pushing tags is not possible).
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    needs: [desktop, daemon, android, daemon-gpu]
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: aiw-*
          merge-multiple: true
      - name: Rename and checksum
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          ver="${tag#v}"
          mkdir -p release
          # Desktop bundles keep the bundler names (spaces become underscores: GitHub rewrites them anyway).
          while IFS= read -r f; do
            b="$(basename "$f")"
            case "$b" in
              aiw-linux-*|aiw-windows-*|aiw-macos-*) cp "$f" "release/aiw-${ver}-${b#aiw-}" ;;
              *.apk) cp "$f" "release/aiw-${ver}-android-arm64-unsigned.apk" ;;
              *) cp "$f" "release/${b// /_}" ;;
            esac
          done < <(find artifacts -type f | sort)
          ls -l release
          test -n "$(ls -A release)"
          (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: AI Workspace Local ${{ env.RELEASE_TAG }}
          body_path: docs/release-notes/${{ env.RELEASE_TAG }}.md
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          fail_on_unmatched_files: true
          files: release/*
