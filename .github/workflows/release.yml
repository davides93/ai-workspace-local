name: Release (DMG macOS, installer Windows)

# Fuori store: solo il DMG macOS (senza sandbox, con tutte le funzioni) e l'installer Windows (.exe).
# iOS, Android e la versione Mac App Store (sandbox, `--features mas`) escono dal flusso degli store:
# vedi .github/workflows/store.yml e docs/store/README.md.
# Heavy, multi-platform builds run on demand or for version tags only.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da pubblicare (es. v0.5.0-beta.2); vuoto = solo build, nessuna release"
        required: false
        default: ""
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

# Read-only by default; only the publish job gets write access to create the release.
permissions:
  contents: read

jobs:
  desktop:
    name: Desktop ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest, args: "--features computer-use --bundles nsis", targets: "" }
          - { name: macOS universale, os: macos-15, args: "--features computer-use --target universal-apple-darwin --bundles dmg", targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      # Apple Foundation Models (macOS 26+): the Swift helper of the native plugin needs the macOS 26
      # SDK, i.e. Xcode 26. It is used for the helper only (build.rs): compiling llama.cpp with
      # Xcode 26 leaves `___isPlatformVersionAtLeast` undefined at link time, so the rest of the
      # build keeps the runner's default Xcode. The app keeps its macOS 11 deployment target.
      - name: Xcode 26 for the Swift helper (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dev="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$dev" ]; then
            echo "::error::Xcode 26 non è installato su questo runner"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          echo "Xcode 26: $dev"
          echo "AIW_APPLE_FM_DEVELOPER_DIR=$dev/Contents/Developer" >> "$GITHUB_ENV"
      # llama.cpp's Metal sources use `@available`, which the clang of Xcode 16+ compiles to calls to
      # `___isPlatformVersionAtLeast`. That function lives in the clang runtime library, which Rust
      # does not link (`-nodefaultlibs`): without it `aiw-desktop` fails at link time. Linking the
      # runtime of the selected toolchain explicitly is the usual fix (the archive is universal).
      - name: Link the clang runtime (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rt="$(clang --print-resource-dir)/lib/darwin/libclang_rt.osx.a"
          if [ ! -f "$rt" ]; then
            echo "::error::libclang_rt.osx.a non trovata in $rt"
            exit 1
          fi
          echo "clang runtime: $rt"
          echo "RUSTFLAGS=-C link-arg=$rt" >> "$GITHUB_ENV"
      - run: npm ci --prefix apps/ui
      - run: npm ci --prefix apps/desktop
      # ---- Firma del codice (docs/release/FIRMA.md) -------------------------------------------
      # Senza i segreti questi passi non fanno nulla e la build resta identica a prima (DMG e
      # installer non firmati). Con i segreti: macOS firma con Developer ID e notarizza; Windows
      # firma con un PFX oppure con Azure Trusted Signing (si sceglie in base ai segreti presenti).
      # I segreti non si passano mai a Tauri vuoti: una variabile vuota sarebbe letta come "presente".
      - name: Firma macOS (Developer ID e notarizzazione, solo con i segreti)
        if: runner.os == 'macOS'
        shell: bash
        env:
          S_CERT: ${{ secrets.APPLE_CERTIFICATE }}
          S_CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          S_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          S_APPLE_ID: ${{ secrets.APPLE_ID }}
          S_APPLE_PW: ${{ secrets.APPLE_PASSWORD }}
          S_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$S_CERT" ] || [ -z "$S_CERT_PW" ] || [ -z "$S_IDENTITY" ]; then
            echo "::notice::Firma macOS non configurata: il DMG esce non firmato, come prima (vedi docs/release/FIRMA.md)."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=$(printf '%s' "$S_CERT" | tr -d '[:space:]')"
            echo "APPLE_CERTIFICATE_PASSWORD=$S_CERT_PW"
            echo "APPLE_SIGNING_IDENTITY=$S_IDENTITY"
            # Entitlements per l'hardened runtime (richiesto dalla notarizzazione): src-tauri/tauri.devid.conf.json
            echo "AIW_SIGN_ARGS=--config src-tauri/tauri.devid.conf.json"
            echo "AIW_SIGN_MAC=1"
          } >> "$GITHUB_ENV"
          if [ -n "$S_APPLE_ID" ] && [ -n "$S_APPLE_PW" ] && [ -n "$S_TEAM" ]; then
            {
              echo "APPLE_ID=$S_APPLE_ID"
              echo "APPLE_PASSWORD=$S_APPLE_PW"
              echo "APPLE_TEAM_ID=$S_TEAM"
              echo "AIW_NOTARIZE_MAC=1"
            } >> "$GITHUB_ENV"
            echo "::notice::Firma macOS Developer ID con notarizzazione."
          else
            echo "::warning::Firma macOS senza notarizzazione: mancano APPLE_ID, APPLE_PASSWORD o APPLE_TEAM_ID. Gatekeeper avviserà comunque."
          fi

      - name: Firma Windows - scelta del metodo
        if: runner.os == 'Windows'
        id: winsign
        shell: pwsh
        env:
          S_PFX: ${{ secrets.WINDOWS_CERTIFICATE }}
          S_PFX_PW: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          S_AZ_CLIENT: ${{ secrets.AZURE_CLIENT_ID }}
          S_AZ_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          S_AZ_TENANT: ${{ secrets.AZURE_TENANT_ID }}
          S_AZ_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          S_AZ_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          S_AZ_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          $azure = $env:S_AZ_CLIENT -and $env:S_AZ_SECRET -and $env:S_AZ_TENANT -and $env:S_AZ_ENDPOINT -and $env:S_AZ_ACCOUNT -and $env:S_AZ_PROFILE
          $pfx = $env:S_PFX -and $env:S_PFX_PW
          if ($azure) { $mode = 'azure' } elseif ($pfx) { $mode = 'pfx' } else { $mode = 'none' }
          if ($mode -eq 'none' -and ($env:S_AZ_CLIENT -or $env:S_AZ_SECRET -or $env:S_AZ_TENANT -or $env:S_AZ_ENDPOINT -or $env:S_AZ_ACCOUNT -or $env:S_AZ_PROFILE -or $env:S_PFX -or $env:S_PFX_PW)) {
            Write-Output "::warning::Segreti di firma Windows incompleti: l'installer esce non firmato (vedi docs/release/FIRMA.md)."
          } elseif ($mode -eq 'none') {
            Write-Output "::notice::Firma Windows non configurata: l'installer esce non firmato, come prima (vedi docs/release/FIRMA.md)."
          } else {
            Write-Output "::notice::Firma Windows: $mode."
          }
          "mode=$mode" >> $env:GITHUB_OUTPUT

      - name: Firma Windows - certificato PFX
        if: runner.os == 'Windows' && steps.winsign.outputs.mode == 'pfx'
        shell: pwsh
        env:
          S_PFX: ${{ secrets.WINDOWS_CERTIFICATE }}
          S_PFX_PW: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String(($env:S_PFX -replace '\s', '')))
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:S_PFX_PW -Force -AsPlainText)
          Remove-Item $pfxPath
          $ts = if ($env:TIMESTAMP_URL) { $env:TIMESTAMP_URL } else { 'http://timestamp.digicert.com' }
          $conf = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = $ts } } }
          $conf | ConvertTo-Json -Depth 5 | Set-Content -Path apps/desktop/src-tauri/signing.windows.conf.json
          "AIW_SIGN_ARGS=--config src-tauri/signing.windows.conf.json" >> $env:GITHUB_ENV
          "AIW_SIGN_WIN=1" >> $env:GITHUB_ENV

      - name: Firma Windows - Azure Trusted Signing
        if: runner.os == 'Windows' && steps.winsign.outputs.mode == 'azure'
        shell: pwsh
        env:
          S_AZ_CLIENT: ${{ secrets.AZURE_CLIENT_ID }}
          S_AZ_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          S_AZ_TENANT: ${{ secrets.AZURE_TENANT_ID }}
          S_AZ_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          S_AZ_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          S_AZ_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          cargo install artifact-signing-cli --locked
          $cmd = "artifact-signing-cli -e $($env:S_AZ_ENDPOINT) -a $($env:S_AZ_ACCOUNT) -c $($env:S_AZ_PROFILE) -d `"AI Workspace Local`" %1"
          $conf = @{ bundle = @{ windows = @{ signCommand = $cmd } } }
          $conf | ConvertTo-Json -Depth 5 | Set-Content -Path apps/desktop/src-tauri/signing.windows.conf.json
          "AZURE_CLIENT_ID=$($env:S_AZ_CLIENT)" >> $env:GITHUB_ENV
          "AZURE_CLIENT_SECRET=$($env:S_AZ_SECRET)" >> $env:GITHUB_ENV
          "AZURE_TENANT_ID=$($env:S_AZ_TENANT)" >> $env:GITHUB_ENV
          "AIW_SIGN_ARGS=--config src-tauri/signing.windows.conf.json" >> $env:GITHUB_ENV
          "AIW_SIGN_WIN=1" >> $env:GITHUB_ENV

      - name: Build bundles
        working-directory: apps/desktop
        # On macOS the build fails instead of silently leaving the Apple Foundation Models helper
        # out (tauri-plugin-aiw-native/build.rs).
        env:
          AIW_REQUIRE_APPLE_FM: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: npx tauri build ${{ matrix.args }} ${{ env.AIW_SIGN_ARGS }}
      # Se la firma era configurata, una build non firmata o non notarizzata deve far fallire il lavoro:
      # meglio nessuna release di un DMG o un installer che il sistema blocca.
      - name: Verifica firma macOS
        if: runner.os == 'macOS' && env.AIW_SIGN_MAC == '1'
        shell: bash
        run: |
          set -euo pipefail
          app="$(find target -path '*release/bundle/macos/*.app' -maxdepth 8 -type d | head -n 1)"
          test -n "$app" || { echo "::error::app non trovata per la verifica"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E "Authority|TeamIdentifier|flags"
          if [ "${AIW_NOTARIZE_MAC:-}" = "1" ]; then
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
          fi
      - name: Verifica firma Windows
        if: runner.os == 'Windows' && env.AIW_SIGN_WIN == '1'
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path target -Recurse -Filter '*-setup.exe'
          if (-not $files) { throw 'installer non trovato per la verifica' }
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Output "$($f.Name): $($sig.Status) - $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "firma non valida: $($f.Name)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: aiw-desktop-${{ matrix.os }}
          path: |
            target/**/release/bundle/**/*-setup.exe
            target/**/release/bundle/**/*.dmg
          if-no-files-found: error

  core-tests:
    name: Core tests ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --no-fail-fast

  # Creates the GitHub (pre)release from the artifacts of the build jobs (the macOS DMG and the
  # Windows installer, nothing else). Tags only.
  publish:
    name: Publish release
    # A pushed tag, or a manual run with a tag name: the release action then creates the tag on
    # the commit that was built (useful where pushing tags is not possible).
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    needs: [desktop]
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: aiw-*
          merge-multiple: true
      - name: Rename and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          # Bundles keep the bundler names (spaces become underscores: GitHub rewrites them anyway).
          while IFS= read -r f; do
            b="$(basename "$f")"
            cp "$f" "release/${b// /_}"
          done < <(find artifacts -type f | sort)
          ls -l release
          test -n "$(ls -A release)"
          (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      # The repository has immutable releases: files can only be attached while the release is a
      # draft, and publishing locks it (and its tag) for good. So the release is created as a draft
      # with every file, and published only afterwards.
      - uses: softprops/action-gh-release@v2
        id: release
        with:
          draft: true
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: AI Workspace Local ${{ env.RELEASE_TAG }}
          body_path: docs/release-notes/${{ env.RELEASE_TAG }}.md
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          fail_on_unmatched_files: true
          files: release/*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false
