name: Publish to stores (App Store Connect, Google Play)

# Con un tag `v*` parte da solo, insieme a release.yml (DMG + Windows su GitHub Release): iOS e
# macOS (Mac App Store, sandbox) su TestFlight, Android sul track alpha (test chiuso) con release
# completed. A mano (Run workflow) si scelgono piattaforme, track e stato.
# Segreti richiesti: vedi docs/store/README.md. Nessun segreto è nel repo.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ios:
        description: "iOS/iPadOS -> TestFlight"
        type: boolean
        default: true
      macos:
        description: "macOS (Mac App Store, sandbox) -> TestFlight"
        type: boolean
        default: false
      android:
        description: "Android (AAB) -> Google Play"
        type: boolean
        default: true
      play_track:
        description: "Track Google Play (alpha = test chiuso, beta = test aperto)"
        type: choice
        options: [alpha, internal, beta, production]
        default: alpha
      play_status:
        description: "Stato release Play (completed = parte subito ai tester; draft = la confermi in console, obbligatorio finché l'app non è mai stata pubblicata)"
        type: choice
        options: [completed, draft]
        default: completed

permissions:
  contents: read

env:
  BUNDLE_ID: dev.aiworkspace.local

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.v.outputs.full }}
      short: ${{ steps.v.outputs.short }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          full=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          # Su un tag la versione dei file deve essere quella del tag: niente upload con numeri sbagliati.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${full}" ]; then
            echo "::error::il tag ${GITHUB_REF_NAME} non corrisponde alla versione ${full} di tauri.conf.json"
            exit 1
          fi
          # Apple accetta solo X.Y.Z numerico come versione breve: 0.5.0-beta.2 -> 0.5.0
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "short=${full%%-*}" >> "$GITHUB_OUTPUT"

  ios:
    if: github.event_name == 'push' || inputs.ios
    needs: version
    runs-on: macos-15
    environment: app-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-ios" }
      - uses: Swatinem/rust-cache@v2
      # App Store Connect accetta solo app iOS compilate con l'SDK iOS 26 (Xcode 26+).
      - name: Xcode 26 (SDK iOS 26)
        shell: bash
        run: |
          dev="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          [ -n "$dev" ] || { echo "::error::Xcode 26 non installato su questo runner"; exit 1; }
          sudo xcode-select -s "$dev/Contents/Developer"
          xcodebuild -version
      - run: npm ci --prefix apps/ui && npm ci --prefix apps/desktop
      - name: Build firmato (.ipa)
        working-directory: apps/desktop
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          npx tauri ios init --ci
          npx tauri ios build --export-method app-store-connect --ci \
            --config "{\"version\":\"${{ needs.version.outputs.short }}\"}"
      - name: Carica su TestFlight
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          ipa=$(find apps/desktop/src-tauri/gen/apple -name '*.ipa' | head -n1)
          test -n "$ipa"
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$KEY_ID" --apiIssuer "$ISSUER"
          rm -f ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

  macos:
    if: github.event_name == 'push' || inputs.macos
    needs: version
    runs-on: macos-15
    environment: app-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - uses: Swatinem/rust-cache@v2
      # Come release.yml: Xcode 26 solo per l'helper Swift di Apple Foundation Models (build.rs);
      # llama.cpp si compila con l'Xcode di default del runner.
      - name: Xcode 26 per l'helper Swift
        shell: bash
        run: |
          dev="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          [ -n "$dev" ] || { echo "::error::Xcode 26 non installato su questo runner"; exit 1; }
          echo "AIW_APPLE_FM_DEVELOPER_DIR=$dev/Contents/Developer" >> "$GITHUB_ENV"
      # `@available` in llama.cpp/Metal usa ___isPlatformVersionAtLeast, che sta nella runtime di clang:
      # Rust non la linka (-nodefaultlibs), quindi la aggiungiamo a mano.
      - name: Linka la runtime di clang
        shell: bash
        run: |
          rt="$(clang --print-resource-dir)/lib/darwin/libclang_rt.osx.a"
          [ -f "$rt" ] || { echo "::error::libclang_rt.osx.a non trovata in $rt"; exit 1; }
          echo "RUSTFLAGS=-C link-arg=$rt" >> "$GITHUB_ENV"
      - run: npm ci --prefix apps/ui && npm ci --prefix apps/desktop
      - name: Certificati e profilo
        env:
          APP_CERT: ${{ secrets.MAC_APP_CERT_P12_BASE64 }}
          INSTALLER_CERT: ${{ secrets.MAC_INSTALLER_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          PROFILE: ${{ secrets.MAC_APPSTORE_PROFILE_BASE64 }}
        run: |
          kc="$RUNNER_TEMP/build.keychain-db"; pw=$(uuidgen)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security list-keychains -d user -s "$kc" login.keychain-db
          for c in APP_CERT INSTALLER_CERT; do
            printf '%s' "${!c}" | base64 --decode > "$RUNNER_TEMP/$c.p12"
            security import "$RUNNER_TEMP/$c.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc"
          printf '%s' "$PROFILE" | base64 --decode > apps/desktop/src-tauri/embedded.provisionprofile
          security find-identity -v "$kc"
      - name: Entitlements con Team ID
        working-directory: apps/desktop/src-tauri
        run: |
          sed -i '' -e "s/TEAM_ID_PLACEHOLDER/${{ secrets.APPLE_TEAM_ID }}/g" -e "s/BUNDLE_ID_PLACEHOLDER/$BUNDLE_ID/g" Entitlements.mas.plist
      - name: Build sandbox (--features mas, senza computer-use) e pacchetto .pkg
        working-directory: apps/desktop
        env:
          AIW_REQUIRE_APPLE_FM: "1"
          APP_SIGN: ${{ secrets.MAC_APP_SIGNING_IDENTITY }}        # es. "3rd Party Mac Developer Application: Nome (TEAMID)" o "Apple Distribution: ..."
          PKG_SIGN: ${{ secrets.MAC_INSTALLER_SIGNING_IDENTITY }}  # es. "3rd Party Mac Developer Installer: Nome (TEAMID)" o "Mac Installer Distribution: ..."
        run: |
          export APPLE_SIGNING_IDENTITY="$APP_SIGN"
          npx tauri build --features mas --target universal-apple-darwin --bundles app \
            --config src-tauri/tauri.mas.conf.json \
            --config "{\"version\":\"${{ needs.version.outputs.short }}\"}"
          app=$(find ../../target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' | head -n1)
          # Apple Foundation Models nella sandbox: l'app non può lanciare un programma che ha scritto
          # lei (l'estrazione in app_data_dir/bin fallisce), solo uno firmato dentro il bundle.
          # Si usa lo stesso helper compilato da build.rs (slice arm64), lo si firma con sandbox +
          # inherit e poi si firma di nuovo l'app, che altrimenti avrebbe il sigillo rotto.
          helper=$(find ../../target/aarch64-apple-darwin/release/build -path '*tauri-plugin-aiw-native-*/out/aiw-apple-fm' -type f | head -n1)
          [ -n "$helper" ] || { echo "::error::helper aiw-apple-fm non trovato (build.rs non l'ha compilato?)"; exit 1; }
          cp "$helper" "$app/Contents/MacOS/aiw-apple-fm"
          codesign --force --sign "$APP_SIGN" --entitlements src-tauri/Entitlements.mas-helper.plist "$app/Contents/MacOS/aiw-apple-fm"
          codesign --force --sign "$APP_SIGN" --entitlements src-tauri/Entitlements.mas.plist "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements - "$app/Contents/MacOS/aiw-apple-fm" 2>&1 | grep -E "app-sandbox|inherit"
          xcrun productbuild --sign "$PKG_SIGN" --component "$app" /Applications "$RUNNER_TEMP/AIW.pkg"
          echo "PKG=$RUNNER_TEMP/AIW.pkg" >> "$GITHUB_ENV"
      - name: Carica su TestFlight
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          xcrun altool --upload-app --type macos --file "$PKG" --apiKey "$KEY_ID" --apiIssuer "$ISSUER"
          rm -f ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

  android:
    if: github.event_name == 'push' || inputs.android
    needs: version  # su un tag controlla anche qui che versione e tag coincidano
    runs-on: ubuntu-latest
    environment: google-play
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      - name: Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null || true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix apps/ui && npm ci --prefix apps/desktop
      - name: Build AAB
        working-directory: apps/desktop
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_NDK="$ANDROID_NDK_LATEST_HOME" ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_API_LEVEL=26
          npx tauri android init --ci
          # Stesse correzioni Kotlin di release.yml (LiteRT-LM / ML Kit GenAI).
          sed -i -E 's/(kotlin-gradle-plugin:)[0-9.]+/\12.4.0/' src-tauri/gen/android/build.gradle.kts
          sed -i -E 's|(implementation\("com.android.tools.build:gradle:[0-9.]+"\))|\1\n    implementation("org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.0")|' src-tauri/gen/android/buildSrc/build.gradle.kts
          npx tauri android build --aab --target aarch64 --ci
      - name: Firma con la upload key
        env:
          KS_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          aab=$(find apps/desktop/src-tauri/gen/android/app/build/outputs/bundle -name '*.aab' | head -n1)
          test -n "$aab"
          printf '%s' "$KS_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$RUNNER_TEMP/upload.jks" \
            -storepass "$KS_PASS" -keypass "$KEY_PASS" "$aab" "$KEY_ALIAS"
          jarsigner -verify "$aab"
          echo "AAB=$aab" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/upload.jks"
      - name: Carica su Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.BUNDLE_ID }}
          releaseFiles: ${{ env.AAB }}
          # Con un tag (nessun input): test chiuso (alpha), release completed, come da default.
          track: ${{ inputs.play_track || 'alpha' }}
          status: ${{ inputs.play_status || 'completed' }}
