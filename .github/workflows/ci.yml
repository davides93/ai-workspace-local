name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  core:
    name: Core Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets
      - run: cargo test
      # The benchmarks (criterion) compile and run once each in test mode: no timing, no thresholds.
      # The numbers are measured by hand, see docs/benchmarks.md.
      - run: cargo test -p aiw-agent -p aiw-engine -p aiw-server --bench shellparse --bench hot_paths --bench server

  core-windows:
    name: Core Rust su Windows (test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --no-fail-fast

  # The container pieces that differ by system (where the Docker client is, paths, line endings, the compose file) on the two systems the
  # app is used on. Neither runner can start a Linux container (macOS runners have no Docker; Windows ones are in Windows-containers
  # mode), so the real start is the Linux job below.
  containers-desktop:
    name: Contenitori, parti per sistema (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p aiw-hw containers
      - run: cargo test -p aiw-engine agent_computer

  # The computer of an agent against a real Docker: builds the image, starts the container, asks the browser's debugging port and
  # stops it. The only place the image and the compose file are really run.
  containers-docker:
    name: Computer dell'agente con Docker vero (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p aiw-cli
      - name: Avvia, interroga, ferma
        shell: bash
        run: |
          set -euo pipefail
          export AIW_HOME="$(mktemp -d)"
          aiw=./target/debug/aiw
          $aiw containers
          trap '$aiw containers down browser || true' EXIT
          $aiw containers up browser | tee up.txt
          grep -q "browser · running" up.txt
          url="$(grep -o 'http://127.0.0.1:[0-9]*' up.txt | head -1)"
          echo "browser su $url"
          for i in $(seq 1 20); do curl -fsS "$url/json/version" && break || sleep 2; done
          curl -fsS "$url/json/version" | grep -q Chrom
          # published on the loopback only
          ! ss -ltn | grep -E ':(0\.0\.0\.0|\*|\[::\]):'"${url##*:}"'\b'

  # The tests of the secrets at rest that talk to the real keychain of the runner (`#[ignore]`: a headless machine has none, and
  # `cargo test` never touches one). Windows Credential Manager, macOS Keychain, and the Secret Service of Linux (gnome-keyring
  # on a D-Bus session, and a session without one). They use a service name of their own and remove what they make.
  keychain:
    name: Portachiavi vero (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Portachiavi del sistema (Windows, macOS)
        if: runner.os != 'Linux'
        run: cargo test -p aiw-engine --lib vault::tests::real_keychain -- --ignored --nocapture --test-threads=1
      # Before gnome-keyring is installed: a runner that has it could start it by D-Bus activation and the test expects none.
      - name: Linux senza servizio dei segreti
        if: runner.os == 'Linux'
        run: env -u DBUS_SESSION_BUS_ADDRESS cargo test -p aiw-engine --lib vault::tests::real_keychain::without_a_secret_service -- --ignored --nocapture --test-threads=1
      - name: Servizio dei segreti (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11 libsecret-tools
      - name: Linux con il servizio dei segreti (gnome-keyring su una sessione D-Bus)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -c '
            # With a password: the login keyring is created and unlocked without a graphical prompt (an empty one asks for it).
            echo -n "test-password" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            cargo test -p aiw-engine --lib vault::tests::real_keychain::the_ -- --ignored --nocapture --test-threads=1
          '

  ui:
    name: UI (typecheck, test, build, mockup)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:mockup
      # The size of both builds stays under the budget in scripts/bundle-budget.json.
      - run: npm run check:bundle
      # Every route of the mockup at 1440 and 390 px, light and dark: no console errors, no horizontal scroll.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke

  ui-e2e:
    name: UI (E2E and accessibility)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json
      - run: npm ci
      - run: npm run build:mockup
      - run: npx playwright install --with-deps chromium
      # The main flows against the mockup (demo transport): first run, chat, documents, approvals, settings, tokens.
      - run: npm run test:e2e
        env:
          PW_NAME: e2e
      # axe-core on every route, light and dark, 390 and 1440 px; keyboard navigation, dialogs, palette.
      - run: npm run test:a11y
        if: ${{ !cancelled() }}
        env:
          PW_NAME: a11y
      # The report is only kept when something failed.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/ui/playwright-report
            apps/ui/test-results
          retention-days: 7

  # The real AG-UI client (@ag-ui/client, two versions) against the real `aiw serve` with a fake OpenAI provider: no account,
  # no network beyond `npm ci`. About 15 s of tests; the build is the cost. See docs/agui.md and tests/agui-client.
  agui-client:
    name: AG-UI (real client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The major the suite was run with (macOS); the other jobs of this file use 22, which was not tried here.
          node-version: 26
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p aiw-cli
      - run: npm ci
        working-directory: tests/agui-client
      - run: npm test
        working-directory: tests/agui-client
      # The CopilotKit runtime (server side, @copilotkit/runtime 1.88.0) in front of the same server: a heavy install (about
      # 300 MB of node_modules), a few seconds of tests. Its telemetry and the analytics of one of its dependencies are off.
      - run: npm ci
        working-directory: tests/agui-copilotkit
        env:
          SCARF_ANALYTICS: "false"
      - run: npm test
        working-directory: tests/agui-copilotkit

  desktop-linux:
    name: Tauri shell (Linux compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # tauri::generate_context! embeds the built UI at compile time.
      - run: npm ci --prefix apps/ui && npm run build --prefix apps/ui
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: cargo build -p aiw-desktop -p tauri-plugin-aiw-native
      - run: cargo test -p tauri-plugin-aiw-native
