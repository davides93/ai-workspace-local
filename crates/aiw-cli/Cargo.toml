[package]
name = "aiw-cli"
description = "`aiw` — headless daemon and command line for AI Workspace Local"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "aiw"
path = "src/main.rs"

[features]
default = []
computer-use = ["aiw-engine/computer-use"]
llama-embedded = ["aiw-engine/llama-embedded"]
llama-metal = ["aiw-engine/llama-metal"]
llama-cuda = ["aiw-engine/llama-cuda"]
llama-vulkan = ["aiw-engine/llama-vulkan"]

[dependencies]
aiw-core.workspace = true
aiw-engine.workspace = true
aiw-models.workspace = true
aiw-server.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
