[package]
name = "aiw-server"
description = "HTTP API (REST + SSE AG-UI events), OpenAI-compatible gateway and static UI for AI Workspace Local"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
aiw-core.workspace = true
aiw-engine.workspace = true
aiw-runtimes.workspace = true
axum = { workspace = true, features = ["multipart"] }
base64.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
chrono.workspace = true
# Device mesh: LAN discovery and pairing QR codes.
mdns-sd = "0.21"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest.workspace = true

[dev-dependencies]
aiw-tools.workspace = true
tempfile = "3"
http-body-util = "0.1"
