[package]
name = "aiw-models"
description = "Model store: GGUF metadata, curated catalog with per-device fit, multi-provider hub (Hugging Face, ModelScope, Ollama, URL), local scan and resumable multi-file downloads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
aiw-core.workspace = true
aiw-hw.workspace = true
async-trait.workspace = true
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

# sysinfo does not build for iOS (no proc_pidinfo); iOS asks statvfs for the free space.
[target.'cfg(not(target_os = "ios"))'.dependencies]
sysinfo.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
libc = "0.2"

[dev-dependencies]
axum.workspace = true
tempfile = "3"
