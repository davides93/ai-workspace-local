[package]
name = "aiw-engine"
description = "Workspace facade: wires hardware, runtimes, models, tools, agents, workflows, storage and approvals"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = []
computer-use = ["aiw-tools/computer-use"]
# In-process llama.cpp (registered as the `llama-embedded` runtime).
llama-embedded = ["aiw-runtimes/llama-embedded"]
llama-metal = ["aiw-runtimes/llama-metal"]
llama-cuda = ["aiw-runtimes/llama-cuda"]
llama-vulkan = ["aiw-runtimes/llama-vulkan"]

[dependencies]
aiw-core.workspace = true
aiw-hw.workspace = true
aiw-runtimes.workspace = true
aiw-models.workspace = true
aiw-tools.workspace = true
aiw-agent.workspace = true
aiw-workflow.workspace = true
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
sha2.workspace = true
reqwest.workspace = true
dirs.workspace = true

[dev-dependencies]
tempfile = "3"
