[package]
name = "aiw-engine"
description = "Workspace facade: wires hardware, runtimes, models, tools, agents, workflows, storage and approvals"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
computer-use = ["aiw-tools/computer-use"]
# In-process llama.cpp (registered as the `llama-embedded` runtime).
llama-embedded = ["aiw-runtimes/llama-embedded"]
# The GPU backends MUST imply `llama-embedded` of THIS crate: `register_embedded` (and the
# settings hook) sit behind `#[cfg(feature = "llama-embedded")]` here, and enabling
# `aiw-runtimes/llama-metal` only turns the feature on in the dependency. Without the
# implication llama.cpp was compiled and linked but never registered (macOS/iOS shell,
# `aiw-cli --features llama-metal`).
llama-metal = ["llama-embedded", "aiw-runtimes/llama-metal"]
llama-cuda = ["llama-embedded", "aiw-runtimes/llama-cuda"]
llama-vulkan = ["llama-embedded", "aiw-runtimes/llama-vulkan"]

[dependencies]
aiw-core.workspace = true
aiw-hw.workspace = true
aiw-runtimes.workspace = true
aiw-models.workspace = true
aiw-tools.workspace = true
aiw-agent.workspace = true
aiw-workflow.workspace = true
aiw-eval.workspace = true
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
globset.workspace = true
ignore.workspace = true
regex.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
sha2.workspace = true
semver.workspace = true
reqwest.workspace = true
dirs.workspace = true
# gzip of the backup archive (pure Rust backend; already in the tree through reqwest).
flate2 = "1"
base64.workspace = true
tokio-tungstenite.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rcgen.workspace = true
ring.workspace = true
pdf-extract = "0.12"

# Key of the secrets at rest in the system keychain (see `vault`): `keyring-core` and the store of each platform, not the
# `keyring` umbrella crate (its default store is an in-memory mock where no store is compiled in, which would lose the key at
# every restart). Only macOS, Windows and Linux: elsewhere the secrets stay as they are and the state is declared.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
keyring-core = "1"
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", default-features = false, features = ["keychain"] }
[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"
# Secret Service over D-Bus with zbus (pure Rust: no libdbus to install on the build machines).
[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }

[dev-dependencies]
# Benchmarks (`cargo bench`); the CI only compiles them. Without the default features criterion does not pull rayon or plotters.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3"
aiw-tools = { workspace = true, features = ["testing"] }
axum.workspace = true

[[bench]]
name = "hot_paths"
harness = false
