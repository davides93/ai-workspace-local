[package]
name = "tauri-plugin-aiw-native"
description = "Native on-device inference for AI Workspace Local: Apple Foundation Models (iOS/macOS), Gemini Nano via ML Kit GenAI and LiteRT-LM (Android)"
version = "0.5.0-beta.5"
edition = "2021"
links = "tauri-plugin-aiw-native"

[dependencies]
aiw-core = { path = "../../../../crates/aiw-core" }
aiw-runtimes = { path = "../../../../crates/aiw-runtimes" }
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2" }
tokio = { version = "1", features = ["sync", "rt"] }
tokio-util = "0.7"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
