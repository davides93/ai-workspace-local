[package]
name = "aiw-desktop"
description = "AI Workspace Local — Tauri 2 shell (desktop and mobile)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "aiw_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aiw-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
# Screen capture + synthetic input for the desktop computer-use agent.
computer-use = ["aiw-engine/computer-use"]
# Mac App Store build (App Sandbox): no external programs are installed or launched, the agents work in
# the app's own folder. Mutually exclusive with `computer-use`. See docs/store/README.md.
mas = []
# GPU variants of the embedded engine: `aiw-engine/llama-cuda|vulkan` imply `llama-embedded`
# (see crates/aiw-engine/Cargo.toml). Never enable them on macOS/iOS, where Metal is automatic.
cuda = ["aiw-engine/llama-cuda"]
vulkan = ["aiw-engine/llama-vulkan"]

[dependencies]
aiw-core.workspace = true
aiw-engine.workspace = true
aiw-server.workspace = true
aiw-runtimes.workspace = true
aiw-tools.workspace = true
tauri-plugin-aiw-native = { path = "../plugins/tauri-plugin-aiw-native" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# In-process llama.cpp everywhere; Metal on Apple platforms. `llama-metal` implies the engine's
# `llama-embedded` feature, which is what registers the `llama-embedded` runtime (before the
# implication existed, macOS and iOS linked llama.cpp+Metal without ever registering it).
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
aiw-engine = { workspace = true, features = ["llama-metal"] }

[target.'cfg(not(any(target_os = "macos", target_os = "ios")))'.dependencies]
aiw-engine = { workspace = true, features = ["llama-embedded"] }

# Desktop only (Windows, macOS, Linux): the app stays alive in the tray, starts at login and tells
# the person what happened while the window was away. Mobile builds do not pull any of this in.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
# Start at login. The Mac App Store build (`mas`) links it but never registers it: the App Sandbox
# forbids writing the launch agent (or driving System Events) that the plugin uses on macOS.
tauri-plugin-autostart = "2"

# A second launch focuses the running window. macOS already opens one instance per app by itself.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
