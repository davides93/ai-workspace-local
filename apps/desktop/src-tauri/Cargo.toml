[package]
name = "aiw-desktop"
description = "AI Workspace Local — Tauri 2 shell (desktop and mobile)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "aiw_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aiw-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
# Screen capture + synthetic input for the desktop computer-use agent.
computer-use = ["aiw-engine/computer-use"]

[dependencies]
aiw-core.workspace = true
aiw-engine.workspace = true
aiw-server.workspace = true
aiw-runtimes.workspace = true
tauri-plugin-aiw-native = { path = "../plugins/tauri-plugin-aiw-native" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true
